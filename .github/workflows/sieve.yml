name: sieve secrets scan

# Dogfooding config: scans sieve's own source. To scan a DIFFERENT repo,
# see "Using this in another repo's CI" in the README — same steps, just
# check out sieve as a sibling directory (or a released binary, once one
# exists) alongside the target repo.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Verified against https://docs.github.com/en/code-security/code-scanning/
  # integrating-with-code-scanning/uploading-a-sarif-file-to-github (2026):
  security-events: write   # required to upload SARIF to the code-scanning tab
  actions: read             # only required for workflows in private repositories
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — sieve --history needs every commit)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build sieve
        run: cargo build --release

      - name: Scan
        id: scan
        run: |
          set +e
          ./target/release/sieve scan . --history --min-confidence medium --format sarif > sieve-results.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sieve-results.sarif
          category: sieve

      - name: Fail the build if sieve found anything (or itself failed)
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "sieve exited ${{ steps.scan.outputs.exit_code }} (1 = possible secrets found, 2 = scan error)."
          echo "See the SARIF results above, or the repo's Security > Code scanning tab once this lands on the default branch."
          exit 1
